<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-labelledby="title desc">
<title id="title">Una produzione verso epsilon nell albero</title><desc id="desc">Grammatica S va in AB, A va in a oppure epsilon, B va in b. L albero usa A verso epsilon e genera b. La foglia epsilon non aggiunge simboli alla frontiera.</desc>
<rect x="1" y="1" width="818" height="558" rx="18" fill="#ffffff" stroke="#dce4ef"/>
<text x="410" y="45" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="bold" fill="#24344b">Una produzione verso ε</text>
<text x="410" y="85" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" fill="#24344b">Grammatica: S → AB; A → a | ε; B → b</text>
<path d="M 410 197 L 235 268" fill="none" stroke="#53657e" stroke-width="2"/>
<path d="M 410 197 L 585 268" fill="none" stroke="#53657e" stroke-width="2"/>
<path d="M 235 312 L 235 383" fill="none" stroke="#53657e" stroke-width="2"/>
<path d="M 585 312 L 585 383" fill="none" stroke="#53657e" stroke-width="2"/>
<rect x="379" y="153" width="62" height="44" rx="7" fill="#eaf1fc" stroke="#8ca8d3" stroke-width="1.5"/>
<text x="410" y="183" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal" fill="#24344b">S</text>
<rect x="204" y="268" width="62" height="44" rx="7" fill="#eaf1fc" stroke="#8ca8d3" stroke-width="1.5"/>
<text x="235" y="298" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal" fill="#24344b">A</text>
<rect x="554" y="268" width="62" height="44" rx="7" fill="#eaf1fc" stroke="#8ca8d3" stroke-width="1.5"/>
<text x="585" y="298" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal" fill="#24344b">B</text>
<rect x="204" y="383" width="62" height="44" rx="19" fill="#f2f4f7" stroke="#b7c1ce" stroke-width="1.5"/>
<text x="235" y="413" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal" fill="#24344b">ε</text>
<rect x="554" y="383" width="62" height="44" rx="19" fill="#e8f6f1" stroke="#81b9a8" stroke-width="1.5"/>
<text x="585" y="413" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal" fill="#24344b">b</text>
<rect x="35" y="475" width="750" height="59" rx="9" fill="#f7f9fc" stroke="#dce4ef" stroke-width="1.5"/>
<text x="410" y="500" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="normal" fill="#24344b">Frontiera: ε · b = b</text>
<text x="410" y="523" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" fill="#24344b">ε documenta la produzione vuota, ma non è un terminale.</text>
</svg>