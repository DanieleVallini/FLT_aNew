<title id="title">Stesso albero, due ordini di espansione</title><desc id="desc">Due copie dello stesso albero per aabb. I numeri sui non terminali indicano l ordine delle produzioni. Sinistra: S, A esterno, A interno, B esterno, B interno. Destra: S, B esterno, B interno, A esterno, A interno.</desc>
