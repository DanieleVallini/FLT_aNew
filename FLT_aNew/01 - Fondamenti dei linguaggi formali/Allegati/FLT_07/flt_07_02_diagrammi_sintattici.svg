<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1065" viewBox="0 0 1000 1065" role="img" aria-labelledby="title desc">
<title id="title">Diagrammi sintattici</title><desc id="desc">Tre diagrammi: dichiarazione id due punti T; scelta integer o real; zero o piu a tramite percorso vuoto e ciclo di ritorno. Capsule per terminali, rettangoli per non terminali.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53657e"/></marker></defs>
<rect x="1" y="1" width="998" height="1063" rx="18" fill="#ffffff" stroke="#dce4ef"/>
<text x="500" y="46" text-anchor="middle" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold">Diagrammi sintattici</text>
<text x="500" y="82" text-anchor="middle" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal">Capsula = terminale · rettangolo = richiamo di un non terminale</text>
<rect x="30" y="115" width="940" height="220" rx="10" fill="#fbfcfe" stroke="#dce4ef" stroke-width="1.6"/>
<text x="56" y="151" text-anchor="start" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold">1 · Sequenza: D → id : T</text>
<path d="M 90 245 H 194" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 306 245 H 435" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 505 245 H 654" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 766 245 H 910" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="194.0" y="221.0" width="112" height="48" rx="20" fill="#e8f6f1" stroke="#81b9a8" stroke-width="1.6"/>
<text x="250" y="253" text-anchor="middle" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal">id</text>
<rect x="435.0" y="221.0" width="70" height="48" rx="20" fill="#e8f6f1" stroke="#81b9a8" stroke-width="1.6"/>
<text x="470" y="253" text-anchor="middle" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal">:</text>
<rect x="654.0" y="221.0" width="112" height="48" rx="6" fill="#eaf1fc" stroke="#8ca8d3" stroke-width="1.6"/>
<text x="710" y="253" text-anchor="middle" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal">T</text>
<text x="500" y="306" text-anchor="middle" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal">Si leggono id e :; poi si segue il diagramma associato a T.</text>
<rect x="30" y="355" width="940" height="260" rx="10" fill="#fbfcfe" stroke="#dce4ef" stroke-width="1.6"/>
<text x="56" y="392" text-anchor="start" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold">2 · Alternativa: T → integer | real</text>
<path d="M 90 500 H 190" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 190 500 C 220 500 220 455 250 455 H 350" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 190 500 C 220 500 220 550 250 550 H 350" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="350.0" y="431.0" width="180" height="48" rx="20" fill="#e8f6f1" stroke="#81b9a8" stroke-width="1.6"/>
<text x="440" y="463" text-anchor="middle" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal">integer</text>
<rect x="350.0" y="526.0" width="180" height="48" rx="20" fill="#e8f6f1" stroke="#81b9a8" stroke-width="1.6"/>
<text x="440" y="558" text-anchor="middle" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal">real</text>
<path d="M 530 455 H 710 C 770 455 770 500 810 500 H 910" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 530 550 H 710 C 770 550 770 500 810 500" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="594" text-anchor="middle" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal">Ogni percorso sceglie una sola alternativa.</text>
<rect x="30" y="635" width="940" height="395" rx="10" fill="#fbfcfe" stroke="#dce4ef" stroke-width="1.6"/>
<text x="56" y="675" text-anchor="start" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold">3 · Ripetizione: R → aR | ε</text>
<path d="M 90 825 H 250" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 250 825 H 455" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="455.0" y="801.0" width="90" height="48" rx="20" fill="#e8f6f1" stroke="#81b9a8" stroke-width="1.6"/>
<text x="500" y="833" text-anchor="middle" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal">a</text>
<path d="M 545 825 H 750" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 750 825 H 910" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 250 825 V 745 H 750 V 825" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="726" text-anchor="middle" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal">percorso vuoto: ε</text>
<path d="M 750 825 V 930 H 250 V 825" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 560 930 H 460" fill="none" stroke="#53657e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="971" text-anchor="middle" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal">Il ritorno permette di leggere altre a.</text>
<text x="500" y="1003" text-anchor="middle" fill="#24344b" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal">Sono possibili ε, a, aa, aaa, …</text>
</svg>