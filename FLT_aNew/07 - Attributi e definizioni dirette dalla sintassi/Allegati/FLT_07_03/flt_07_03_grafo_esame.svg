<text x="72" y="985" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#34465b" font-weight="400" text-anchor="start">Continuo: regola esplicita    ·    Tratteggiato: dipendenza riassunta del sottoalbero</text>
<text x="72" y="1020" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#526276" font-weight="400" text-anchor="start">Arancione: ereditati · Blu: sintetizzati. La freccia va dal dato necessario al risultato.</text>
