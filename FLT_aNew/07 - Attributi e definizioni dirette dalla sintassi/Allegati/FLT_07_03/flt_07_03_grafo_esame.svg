<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Grafo delle dipendenze del frammento d’esame</title>
<desc id="desc">Sette istanze di attributo e sette dipendenze. A.b e B.s alimentano i rami di C e A1, i cui risultati C.s e A1.a consentono di calcolare A.a. Due archi tratteggiati riassumono le dipendenze interne ai sottoalberi richieste dall’esame.</desc>
<rect width="1440" height="1080" fill="#ffffff"/>
<defs>
<marker id="arrowDirect" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#36587d"/></marker>
<marker id="arrowAssumed" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#b4691b"/></marker>
</defs>
<text x="48" y="55" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#10243a" font-weight="700" text-anchor="start">Grafo delle dipendenze · frammento d’esame</text>
<text x="48" y="101" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#526276" font-weight="400" text-anchor="start">A → B C A₁ · gli archi tratteggiati riassumono l’ipotesi sui sottoalberi</text>
