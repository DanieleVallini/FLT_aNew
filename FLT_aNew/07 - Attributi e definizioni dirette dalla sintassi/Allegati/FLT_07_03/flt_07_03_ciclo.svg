<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-labelledby="title desc">
<title id="title">Un ciclo impedisce un ordinamento topologico</title>
<desc id="desc">Le quattro istanze B.i, B.s, C.i e C.s formano un ciclo orientato. Ogni valore dipende dal precedente e nessun calcolo del ciclo può iniziare.</desc>
<rect width="1440" height="910" fill="#ffffff"/>
<defs>
<marker id="arrowCycle" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#b74646"/></marker>
</defs>
<text x="48" y="55" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#10243a" font-weight="700" text-anchor="start">Un ciclo blocca l’ordine di valutazione</text>
<text x="48" y="101" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#526276" font-weight="400" text-anchor="start">Produzioni: P → B C, B → b, C → c</text>
<path d="M 470 280 L 970 280" fill="none" stroke="#b74646" stroke-width="3.5" marker-end="url(#arrowCycle)"/>
<path d="M 1090 328 L 1090 532" fill="none" stroke="#b74646" stroke-width="3.5" marker-end="url(#arrowCycle)"/>
<path d="M 970 580 L 470 580" fill="none" stroke="#b74646" stroke-width="3.5" marker-end="url(#arrowCycle)"/>
<path d="M 350 532 L 350 328" fill="none" stroke="#b74646" stroke-width="3.5" marker-end="url(#arrowCycle)"/>
<rect x="230" y="232" width="240" height="96" rx="16" fill="#fff5e9" stroke="#c58b45" stroke-width="2"/>
<text x="350" y="275" font-family="DejaVu Sans Mono, monospace" font-size="28" fill="#925611" font-weight="700" text-anchor="middle">B.i</text>
<text x="350" y="307" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#925611" font-weight="400" text-anchor="middle">ereditato</text>
<rect x="970" y="232" width="240" height="96" rx="16" fill="#edf5ff" stroke="#4b83bc" stroke-width="2"/>
<text x="1090" y="275" font-family="DejaVu Sans Mono, monospace" font-size="28" fill="#164f85" font-weight="700" text-anchor="middle">B.s</text>
<text x="1090" y="307" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#164f85" font-weight="400" text-anchor="middle">sintetizzato</text>
<rect x="970" y="532" width="240" height="96" rx="16" fill="#fff5e9" stroke="#c58b45" stroke-width="2"/>
<text x="1090" y="575" font-family="DejaVu Sans Mono, monospace" font-size="28" fill="#925611" font-weight="700" text-anchor="middle">C.i</text>
<text x="1090" y="607" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#925611" font-weight="400" text-anchor="middle">ereditato</text>
<rect x="230" y="532" width="240" height="96" rx="16" fill="#edf5ff" stroke="#4b83bc" stroke-width="2"/>
<text x="350" y="575" font-family="DejaVu Sans Mono, monospace" font-size="28" fill="#164f85" font-weight="700" text-anchor="middle">C.s</text>
<text x="350" y="607" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#164f85" font-weight="400" text-anchor="middle">sintetizzato</text>
<rect x="48" y="748" width="1344" height="132" rx="12" fill="#fff2f2"/>
<text x="72" y="782" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#34465b" font-weight="400" text-anchor="start">P → B C:  B.i := C.s;  C.i := B.s</text>
<text x="72" y="820" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#34465b" font-weight="400" text-anchor="start">B → b:  B.s := B.i + 1     ·     C → c:  C.s := C.i + 1</text>
<text x="72" y="856" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#9c3434" font-weight="700" text-anchor="start">Ogni attributo del ciclo attende un altro attributo dello stesso ciclo.</text>
</svg>
