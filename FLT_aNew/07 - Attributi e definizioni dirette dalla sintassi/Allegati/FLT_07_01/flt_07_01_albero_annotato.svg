<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">Albero di derivazione annotato di 3 + 4 * 5</title>
<desc id="desc">La radice E ha val 23. Il figlio E ha val 3, il figlio T ha val 20. Il prodotto 4 * 5 viene calcolato prima della somma. Ogni occorrenza possiede il proprio attributo val; i token numerici possiedono lexval.</desc>
